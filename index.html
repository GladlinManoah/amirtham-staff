<!doctype html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17485A">
<title>அமிர்தம் ஆவின்பால் — பணியாளர்</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/nst-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nst-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"NST";src:url(fonts/nst-400.woff2) format("woff2");font-weight:400 600;font-display:swap;unicode-range:U+0B80-0BFF,U+200C-200D,U+25CC}
@font-face{font-family:"NST";src:url(fonts/nst-700.woff2) format("woff2");font-weight:700 900;font-display:swap;unicode-range:U+0B80-0BFF,U+200C-200D,U+25CC}
:root{--ink:#16323B;--teal:#17485A;--teal2:#0F3644;--gold:#C9A227;--milk:#F7F3EA;--card:#fff;--mute:#6B7A80;--ok:#2E7D32;--bad:#C62828;--brown:#6B3A1E;--amber:#B26A00;--num:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font-family:"NST",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:var(--milk);color:var(--ink);padding-bottom:calc(86px + env(safe-area-inset-bottom))}
b,strong{font-weight:700}
.hero{background:radial-gradient(120% 140% at 0% 0%,#22607A 0%,var(--teal) 45%,var(--teal2) 100%);color:#fff;padding:22px 16px 52px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:76px;background:var(--milk);border-radius:50% 50% 0 0}
.hero .ring{position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;border:22px solid rgba(255,255,255,.05)}
.bt{font-weight:800;font-size:23px;line-height:1.25;position:relative;z-index:1;padding-right:96px}
.lt{position:absolute;right:12px;top:14px;z-index:3;display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:2px}
.lt span{padding:4px 11px;border-radius:12px;font-size:12.5px;color:#D7E7EC;cursor:pointer;font-weight:600}
.lt span.on{background:#fff;color:var(--teal)}
.today{position:relative;z-index:2;margin:-38px 14px 0;background:var(--card);border-radius:18px;box-shadow:0 8px 24px rgba(23,72,90,.13);padding:12px 16px;display:flex;align-items:center;gap:10px}
.today .dt{flex:1;min-width:0;color:var(--teal);line-height:1.35}
.today .dt b{display:block;font-size:min(18px,4.8vw)}
.today .dt span{font-size:15px;color:var(--mute);font-weight:600}
.today .ck{flex:none;font-family:var(--num);font-weight:700;font-size:min(17px,4.4vw);color:var(--teal);background:#EEF5F7;border-radius:10px;padding:6px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.who{margin:14px 18px 0;font-size:17px;color:var(--teal);line-height:1.4}
.who span{color:var(--mute);font-size:15px}
.net{margin:10px 14px 0;padding:8px 12px;border-radius:12px;font-size:13.5px;display:none;line-height:1.45}
.net.auth{display:block;background:#FDECEA;color:var(--bad);font-weight:700}
.card{background:var(--card);margin:12px 14px;border-radius:18px;padding:15px 16px;box-shadow:0 2px 10px rgba(23,72,90,.07)}
.h{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h small{font-size:13px;font-weight:600;color:var(--teal);border:1.5px solid var(--teal);border-radius:12px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.shift{display:flex;gap:10px;margin-bottom:4px}
.shift>div{flex:1;border-radius:14px;background:#F6F8F8;padding:10px 12px;min-width:0}
.shift .t{font-size:13px;color:var(--mute)}
.shift b{display:block;font-family:var(--num);font-size:21px;margin-top:2px}
.shift i{font-style:normal;font-size:12.5px;color:var(--mute);display:block;margin-top:2px}
.shift>div.on{background:#E9F4EA}.shift>div.on b{color:var(--ok)}
.shift>div.lv{background:#EDF3FB}.shift>div.lv b{font-family:inherit;font-size:16px;color:#1F5C99}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;border:0;border-radius:18px;font-size:21px;font-weight:700;padding:15px 10px 13px;color:#fff;background:linear-gradient(180deg,#36934A,#2A7A3C);margin:12px 0 4px;font-family:inherit;box-shadow:0 5px 0 #1F5E2D;cursor:pointer;line-height:1.3;text-align:center}
.big.t{background:linear-gradient(180deg,#22607A,var(--teal));box-shadow:0 5px 0 #0E3341}
.big.y{background:linear-gradient(180deg,#D3AC33,#B8901B);box-shadow:0 5px 0 #8E6E10;font-size:18px}
.big.rd{background:linear-gradient(180deg,#D9534F,#B83A36);box-shadow:0 5px 0 #8A2724}
.big.w{background:#fff;color:var(--teal);border:2px solid var(--teal);box-shadow:0 4px 0 #CFDCE0}
.big:disabled{opacity:.45;box-shadow:none;transform:translateY(5px);cursor:default}
.big.done{background:#DDE5E7;color:#5A6E74;box-shadow:none;transform:translateY(5px);opacity:1}
.big .s{font-size:12.5px;font-weight:600;opacity:.85;margin-top:2px}
.sm{font-size:13px;color:var(--mute);margin-top:8px;text-align:center}
.msg{margin:12px 14px 0;padding:13px 15px;border-radius:16px;font-size:15.5px;line-height:1.6;display:none;white-space:pre-line}
.ok{background:#E7F4E8;color:#1B5E20}.warn{background:#FFF3DC;color:#7A4C00}.err{background:#FDECEA;color:#B71C1C}.wait{background:#EAF2F5;color:var(--teal)}
input,select,textarea{font-size:17px;padding:12px;width:100%;margin:5px 0;border:1.5px solid #DCE3E5;border-radius:14px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal)}
.lbl{font-size:13px;color:var(--mute);margin-top:10px;font-weight:600}
.seg{display:flex;gap:8px;margin:5px 0 4px}.seg>span,.seg4>span{flex:1;text-align:center;padding:9px 2px 8px;border:1.5px solid #DCE3E5;border-radius:14px;font-size:15px;cursor:pointer;background:#fff;line-height:1.25}
.seg>span.on,.seg4>span.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.rule{font-size:13px;color:#4E5C61;background:#F6F4EE;border-radius:12px;padding:9px 11px;margin-top:12px;line-height:1.6}
.redbox{font-size:14px;color:#B71C1C;background:#FDECEA;border:1.5px solid #E8A6A1;border-radius:12px;padding:9px 11px;margin-top:8px;line-height:1.6;font-weight:600}
.rq{border-bottom:1px solid #F0ECE2;padding:11px 2px;font-size:15px}.rq:last-child{border-bottom:0}
.rq .t{display:flex;justify-content:space-between;gap:8px}.rq .t span:first-child{flex:1}
.pill{font-size:12.5px;font-weight:700;white-space:nowrap;border-radius:10px;padding:2px 9px;height:fit-content;display:inline-block}
.p{color:#8A6D00;background:#FFF4CC}.g{color:#1F6B2A;background:#E3F2E5}.r{color:#B71C1C;background:#FDE3E1}.gr{color:#777;background:#EEE}
.rep{font-size:14px;color:#334;margin-top:6px;background:#F6F8F8;border-radius:10px;padding:7px 10px}
.fl{font-size:12.5px;color:#B71C1C;margin-top:4px}
.mini{border:1.5px solid #DCE3E5;background:#fff;border-radius:12px;padding:6px 12px;font-size:13px;font-family:inherit;color:#555;margin-top:8px;cursor:pointer}
.a{font-size:15px;display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #F0ECE2}
.tot2{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:9px 2px 2px}
.dec{margin:12px 14px 0;border-radius:16px;padding:11px 14px;font-size:15px;line-height:1.55;border-left:6px solid}
.dec.g{background:#E7F4E8;border-color:#2E7D32;color:#1B5E20}.dec.r{background:#FDECEA;border-color:#C62828;color:#8E1B1B}
.dec .rep{background:rgba(255,255,255,.7)}
.cover{background:linear-gradient(160deg,#EAF4F7,#D5E9EF);border:2px solid var(--teal);border-radius:20px;padding:12px 10px 10px;margin:2px 0 12px}
.cover .ttl{text-align:center;font-size:14px;font-weight:700;color:var(--teal);letter-spacing:.4px;margin-bottom:9px}
.cv{display:flex;gap:8px}.cv div{flex:1;background:#fff;border-radius:15px;text-align:center;padding:9px 0 7px;box-shadow:0 2px 0 rgba(23,72,90,.12)}
.cv b{display:block;font-family:var(--num);font-size:34px;line-height:1.1;color:var(--teal)}.cv span{font-size:13px;color:var(--mute)}
.cover .tot{text-align:center;font-size:15.5px;margin-top:9px;color:var(--teal)}
.cover .tot b{font-family:var(--num)}
.veh{border-radius:16px;padding:12px;text-align:center;font-size:16.5px;font-weight:700;margin-bottom:12px;line-height:1.45}
.veh.y{background:#E7F4E8;color:#1B5E20;border:2px solid #2E7D32}.veh.n{background:#FDECEA;color:#B71C1C;border:2px solid #C62828}
.dl{font-size:15px;line-height:1.7;background:#FBF8F2;border-radius:12px;padding:9px 12px}
.hd{font-size:14px;color:var(--brown);font-weight:800;margin-top:10px;letter-spacing:.2px;border-bottom:1.5px solid #E8D6C4;padding-bottom:2px}
.hd:first-child{margin-top:0}
.ln{padding:2px 0}.ln.red{color:var(--bad);font-weight:700}.ln.dn{color:#1F5C99}.ln.up{color:var(--ok)}
.stale{background:#FDECEA;color:var(--bad);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.upd{font-size:12px;color:var(--mute);text-align:right;margin-top:6px}
.rtn{font-family:var(--num);background:var(--teal);color:#fff;border-radius:10px;padding:0 8px;font-size:.85em;margin-right:2px}
/* விநியோகம் */
.chips{display:flex;gap:10px}.chips>div{flex:1;background:#F6F8F8;border-radius:14px;padding:10px;text-align:center}.chips b{display:block;font-family:var(--num);font-size:28px;color:var(--teal)}.chips span{font-size:13.5px;color:var(--mute)}
.timer{text-align:center;margin-top:12px;background:#FFF8E1;border-radius:14px;padding:10px}
.timer span{display:block;font-size:13.5px;color:#7A5A00;font-weight:600}
.timer b{font-family:var(--num);font-size:34px;color:#5D4300;font-variant-numeric:tabular-nums}
.runtop{display:flex;align-items:center;gap:12px;margin:12px 14px 0}
.runtop .st{font-family:var(--num);font-size:30px;font-weight:800;color:var(--teal);white-space:nowrap}
.runtop .pg{flex:1;min-width:0}
.prog{height:12px;background:#E4ECEE;border-radius:6px;overflow:hidden;margin:4px 0 2px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#36934A,#5DB56E)}
.progt{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);font-weight:600}
.stop{margin:10px 10px 0;border:3px solid var(--teal);border-radius:24px;padding:14px 14px 12px;background:#fff;min-height:calc(100vh - 290px);display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(23,72,90,.12);touch-action:pan-y}
.stop.d{border-color:#2E7D32;background:#F3FAF3}.stop.i{border-color:var(--amber);background:#FFF9EE}
.stop.inR{animation:inR .22s ease}.stop.inL{animation:inL .22s ease}
.stop .pos{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:.4px}
.stop .pos .sb{font-size:13px;border-radius:10px;padding:2px 10px}
.stop .nmx{font-size:30px;font-weight:800;color:var(--teal);line-height:1.25;margin-top:6px}
.stop .nmx .rtn{font-size:.8em}
.pkbig{font-size:40px;font-weight:800;font-family:var(--num);color:var(--ink);margin:10px 0 0;line-height:1.2}
.pkbig small{font-family:"NST",var(--num);font-size:.6em;font-weight:700}
.qsm{font-size:16px;color:var(--mute);margin-top:2px}
.tag{display:inline-block;align-self:flex-start;font-size:14px;font-weight:700;border-radius:10px;padding:3px 10px;margin:6px 4px 0 0}
.tag.dn{background:#E3EEF9;color:#1F5C99}.tag.up{background:#E3F2E5;color:var(--ok)}.tag.alt{background:#F3E8FF;color:#6A1B9A}.tag.sw{background:#FFF0D9;color:var(--amber)}
.tmpad{background:#FDECEA;border:2px solid var(--bad);color:#B71C1C;border-radius:14px;padding:9px 12px;margin-top:10px;font-size:17px;font-weight:700;line-height:1.5}
.tmpad span{display:block;font-weight:600;font-size:16px;color:#8E1B1B}
.onote{background:#FFF8E1;border-radius:12px;padding:8px 12px;font-size:16px;margin-top:10px;color:#5D4300}
.ph{width:100%;max-height:170px;object-fit:cover;border-radius:14px;margin-top:10px;background:#EEE}
.sp{flex:1}
.acts{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:12px}
.acts2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.ib{border:0;border-radius:18px;height:74px;font-size:36px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1}
.ib.ok{font-size:46px;font-weight:900;background:linear-gradient(180deg,#36934A,#2A7A3C);box-shadow:0 5px 0 #1F5E2D}
.ib.is{background:linear-gradient(180deg,#F0A42B,#D9860B);box-shadow:0 5px 0 #A86200}
.ib.nv{background:linear-gradient(180deg,#22607A,var(--teal));box-shadow:0 5px 0 #0E3341;height:62px;font-size:30px}
.ib.lc{background:linear-gradient(180deg,#3B82D6,#2563B8);box-shadow:0 5px 0 #1A4A8C;height:62px;font-size:30px}
.ib.pc{background:linear-gradient(180deg,#8E5BD6,#6E3FB8);box-shadow:0 5px 0 #50298C;height:62px;font-size:30px}
.ib:disabled{opacity:.35;box-shadow:none;transform:translateY(5px)}
.ib.pend{opacity:.55}
.ib:active{transform:translateY(4px);box-shadow:none}
.nxp{display:flex;justify-content:space-between;margin-top:10px;font-size:14.5px;color:var(--teal);font-weight:700}
.nxp span{padding:6px 4px;cursor:pointer}
.iss label{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:17px;border-bottom:1px solid #F0ECE2}.iss input{width:24px;height:24px;margin:0}
.lst .row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #F0ECE2;font-size:15px;cursor:pointer}
.lst .row:last-child{border-bottom:0}
.lst .ic{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.ic.d{background:#E3F2E5;color:var(--ok)}.ic.i{background:#FFF0D9;color:var(--amber)}.ic.p{background:#EEF1F2;color:#90A4AE}.ic.c{background:var(--teal);color:#fff}
.lst .row .q{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap}
.lst .row.cur{background:#EEF6F8;border-radius:12px}
.fin{text-align:center}
.fin .ft{font-size:17px;font-weight:700;color:var(--ok)}
.fin .fb{font-family:var(--num);font-size:44px;font-weight:800;color:var(--teal);line-height:1.15;margin:4px 0 10px}
.fin .rw{display:flex;gap:10px}.fin .rw>div{flex:1;background:#F6F8F8;border-radius:14px;padding:10px 6px}
.fin .rw span{display:block;font-size:13.5px;color:var(--mute)}.fin .rw b{font-size:19px;color:var(--teal)}
.spd{margin-top:10px;font-size:15.5px;color:#334;line-height:1.6}
.bikew{background:#FDECEA;border:2.5px solid var(--bad);border-radius:18px;padding:14px;color:#8E1B1B;font-size:18.5px;font-weight:700;line-height:1.75}
.bikeq{font-size:20px;font-weight:800;color:var(--teal);text-align:center;margin:14px 0 2px}
.thanks{background:#E7F4E8;border-radius:18px;padding:16px;font-size:18px;font-weight:700;color:#1B5E20;line-height:1.75;text-align:center}
.two{display:flex;gap:10px}.two>button{flex:1;min-width:0;margin-top:10px;font-size:19px;padding-left:6px;padding-right:6px}
/* பதிவு */
.mon{display:flex;background:#EFEBE0;border-radius:12px;padding:3px;margin:12px 14px 0}.mon>span{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:14.5px;cursor:pointer}
.mon>span.on{background:#fff;font-weight:700;color:var(--teal);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.el{border-radius:14px;padding:11px 12px;margin-top:10px;font-size:14.5px;line-height:1.6}
.el.g{background:#E7F4E8;color:#1B5E20}.el.r{background:#FDECEA;color:#B71C1C}
.day{border-left:5px solid;border-radius:12px;padding:9px 12px;margin:10px 0}
.day.c-r{border-color:#C62828;background:#FFF5F4}.day.c-g{border-color:#2E7D32;background:#F2FAF2}.day.c-a{border-color:#E09A1A;background:#FFF8EA}
.day .dh{font-weight:700;font-size:16px;font-family:var(--num)}
.day .sl{font-size:14.5px;line-height:1.6;margin-top:4px}.day .sl b{color:var(--teal)}
.day .lt2{color:var(--bad);font-size:13.5px}
.day .mm{font-size:14px;margin-top:6px;font-weight:600;line-height:1.55}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.slip .a b{font-family:var(--num)}.slip .a.n{color:var(--bad)}.slip .a.t{font-weight:700;border-top:1.5px solid #DDD}.slip .a.net{font-weight:800;font-size:17px;color:var(--ok);border-bottom:0}
/* விதிமுறை */
.rules h3{font-size:16px;color:var(--teal);margin:18px 0 6px;display:flex;align-items:center;gap:9px}.rules h3:first-child{margin-top:2px}
.rules h3 span{background:var(--teal);color:#fff;border-radius:50%;width:25px;height:25px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-family:var(--num)}
.rules ul{margin:0;padding-left:20px}.rules li{font-size:14.5px;line-height:1.65;margin:4px 0}.rules li.red{color:#B71C1C;font-weight:700}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;margin:10px 0 4px;color:#B71C1C;font-weight:700}.chk input{width:22px;height:22px;margin:0}
/* பக்கங்கள் */
.sec{display:none}.sec.on{display:block}
.sec.inR{animation:inR .25s ease}.sec.inL{animation:inL .25s ease}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid #E8E2D2;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9;box-shadow:0 -4px 18px rgba(23,72,90,.08)}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;border-radius:14px;color:#7D8A8F;position:relative;cursor:pointer}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav b{font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav a.on{color:var(--teal);background:#E6F0F3}
body.route .hero,body.route .today,body.route .who{display:none}body.route .runtop{margin-top:14px}
.nav .n{position:absolute;top:1px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:9px;min-width:17px;height:17px;font-size:10.5px;font-family:var(--num);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;border-radius:16px;padding:12px 14px;font-size:15.5px;line-height:1.5;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);display:none}

<script>
var API='https://script.google.com/macros/s/AKfycbwWvbZnE_KESEOjOjaYEZgljZOe_3wc1LXOe4AYs0dx36zMGFZV84j08N5ukCNo4owK/exec',VER='v3 · 19-10-2026';
var K='',LANG='ta',S=null,Q=[],TAB='att',ORDER=['att','run','rec','req','rule'],CUR={FN:null,AN:null},ISS=null,SYNC=false,AGAIN=false,NET='',BUSY=false,GPS=false,CLK=null,DIR='';

function $(i){return document.getElementById(i)}
function T(ta,en){return LANG==='en'?en:ta}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x==null?null:JSON.parse(x)}localStorage.setItem(k,JSON.stringify(v));return v}catch(e){return null}}
function p2(n){return('0'+n).slice(-2)}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dmy(s){var p=String(s).split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function mins(d){return d.getHours()*60+d.getMinutes()}
function hm(d){return p2(d.getHours())+':'+p2(d.getMinutes())}
function tmin(s,pm){var m=String(s||'').match(/(\d{1,2})\s*[:.]\s*(\d{1,2})/);if(!m)return null;var h=+m[1];if(pm&&h<12)h+=12;return h*60+(+m[2])}
function h12(t){t=((t%1440)+1440)%1440;var h=Math.floor(t/60);return((h%12)||12)+':'+p2(t%60)+(t<720?' AM':' PM')}
function hh(t){t=((t%1440)+1440)%1440;var h=Math.floor(t/60);return p2((h%12)||12)+':'+p2(t%60)}
function dur(m){if(m==null||m<0)return'—';return m<60?m+T(' நி',' min'):Math.floor(m/60)+T(' ம ',' h ')+(m%60)+T(' நி',' min')}
function fmtN(x){return Math.round(Number(x)||0).toLocaleString('en-IN')}
function shL(F){return F==='FN'?T('காலை','Morning'):T('மாலை','Evening')}

function dist(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.pow(Math.sin(x/2),2)+Math.cos(a*r)*Math.cos(c*r)*Math.pow(Math.sin(y/2),2);return Math.round(2*6371000*Math.asin(Math.sqrt(h)))}
var PKS=[['0.5',2],['0.7',1],['1',0]];
function pkTxt(p){var t=[],u=T(' லி',' L');PKS.forEach(function(x){if(p[x[1]])t.push(x[0]+u+' × '+p[x[1]])});return t.join(' + ')}
function qL(q){return(Math.round(q*100)/100)+' '+T('லி','L')}
function kg(p){return(p[0]*1+p[1]*0.7+p[2]*0.5)*((S&&S.cfg.kg1)||1.035)}

function M(c,t){var m=$('msg');if(!t){m.style.display='none';return}m.className='msg '+c;m.textContent=t;m.style.display='block';window.scrollTo(0,0)}
function MH(c,h){var m=$('msg');m.className='msg '+c;m.innerHTML=h;m.style.display='block';window.scrollTo(0,0)}

/* உரிமையாளர் Sheet-ல் மாற்றும் செய்திகள் — {…} நிரப்பி, *…* தடித்து */
function MS(k,v){var m=S&&S.msgs&&S.msgs[k],t=m?(m[LANG]||m.ta):k;t=esc(t);v=v||{};
 t=t.replace(/\{([^{}]+)\}/g,function(a,x){return(x in v)?esc(v[x]):a});
 return t.replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}

/* ---------- வரிசை (signal இல்லாவிட்டாலும் phone-ல் சேமித்து, பின் அனுப்பும் — அவருக்குத் தெரிய வேண்டியதில்லை) ---------- */
function enq(fn,p){var it={cid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),fn:fn,at:Date.now(),p:p,n:0};Q.push(it);ls('q',Q);renderAll();setTimeout(sync,200);return it}
function blankAtt(){return{t:'',milk:'',st:'',why:'',allow:0,off:false,b:'',e:'',bike:''}}
function view(){
 if(!S)return null;var v=JSON.parse(JSON.stringify(S)),now=new Date(),td=ymd(now);
 if(v.today!==td){v.att={FN:blankAtt(),AN:blankAtt()};v.dlog={FN:{},AN:{},mk:{}};v.oldDay=true;v.today=td;v.offNext={FN:false,AN:false}}
 v.dlog.ph=v.dlog.ph||{};
 Q.forEach(function(it){var d=new Date(it.at);if(ymd(d)!==td)return;var F=it.p.shift||(mins(d)<720?'FN':'AN'),a=v.att[F];
  if(it.fn==='in'){if(!a.t){a.t=hm(d);a.st='P'}}
  else if(it.fn==='why'){a.why=it.p.why}
  else if(it.fn==='dstart'){if(!a.b)a.b=hm(d)}
  else if(it.fn==='dend'){if(!a.e)a.e=hm(d)}
  else if(it.fn==='bike'){a.bike=it.p.ans}
  else if(it.fn==='stop'){if(it.p.a==='undo')delete v.dlog[F][it.p.id];else v.dlog[F][it.p.id]={a:it.p.a,why:it.p.why}}

function post(fn,args){
 var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},40000);
 return fetch(API,{method:'POST',body:JSON.stringify({key:K,fn:fn,args:[args]}),signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.text()}).then(function(t){clearTimeout(tm);var j;try{j=JSON.parse(t)}catch(x){var e1=new Error('JSON? '+t.slice(0,80));e1.srv=1;throw e1}if(!j.ok){var e2=new Error(j.err||'?');e2.srv=1;throw e2}return j.r},function(e){clearTimeout(tm);throw e})}
function tzName(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){return''}}
function clockCheck(st,sent,got){if(!st||!st.now)return;var mid=(sent+got)/2,sk=Math.abs(st.now-mid),mx=((st.cfg&&st.cfg.skewMax)||3)*60000;
 var tz=tzName(),tzBad=(tz&&!/^Asia\/(Kolkata|Calcutta)$/.test(tz))||new Date().getTimezoneOffset()!==-330;
 CLK=(sk>mx||tzBad)?1:0;ls('clk',CLK);rLock()}
function rLock(){var l=$('lock');if(!CLK||!S){l.className='lock';return}
 l.innerHTML='<div class="ico">🕒</div><div>'+MS('clock')+'</div><button class="big w" id="lkr">'+T('மீண்டும் சோதி','Check again')+'</button>';l.className='lock on';
 $('lkr').onclick=function(){$('lkr').disabled=true;sync()}}
function sync(){
 if(!K)return;if(SYNC){AGAIN=true;return}SYNC=true;
 var items=Q.slice(0,40),fn=items.length?'sync':'state',t0=Date.now();
 var args={now:t0,tz:tzName(),lang:LANG};if(items.length)args.items=items.map(function(x){return{cid:x.cid,fn:x.fn,at:x.at,p:x.p}});
 post(fn,args).then(function(r){
  var st=items.length?r.state:r,bad=[];
  if(items.length){r.res.forEach(function(x){var i=-1;Q.forEach(function(q,k){if(q.cid===x.cid)i=k});if(i<0)return;
   if(x.ok||!x.retry){Q.splice(i,1);if(!x.ok&&x.msg)bad.push(x.msg)}else{Q[i].n=(Q[i].n||0)+1;if(Q[i].n>=6)Q.splice(i,1)}});ls('q',Q)}
  S=st;ls('st',S);NET='ok';clockCheck(st,t0,Date.now());renderAll();if(bad.length)M('err',bad.join('\n\n'));
 }).catch(function(e){var m=String(e&&e.message||e);NET=/AUTH/.test(m)?'auth':'off';renderNet();if($('lkr'))$('lkr').disabled=false}).then(function(){SYNC=false;if(AGAIN){AGAIN=false;setTimeout(sync,400)}})}
function act(a,p,after){
 if(BUSY)return;BUSY=true;M('wait',T('அனுப்புகிறது…','Sending…'));p=p||{};
 post('act',{a:a,p:p,lang:LANG}).then(function(r){BUSY=false;if(r.state){S=r.state;ls('st',S)}renderAll();M(r.ok?(r.warn?'warn':'ok'):'err',r.msg);if(after)after(r)})
  .catch(function(e){BUSY=false;NET=/AUTH/.test(String(e&&e.message))?'auth':'off';renderNet();M('err',T('கோரிக்கை அனுப்ப இணையம் தேவை — சிறிது நேரம் கழித்து மீண்டும் அனுப்பவும்.','Requests need internet — please send again in a little while.'))})}

function rHead(){var d=new Date();
 $('dtxt').innerHTML='<b>'+d.getDate()+' '+(LANG==='en'?MEN:MTA)[d.getMonth()]+' '+d.getFullYear()+'</b><span>'+(LANG==='en'?WEN:WTA)[d.getDay()]+'</span>';
 tickClock();$('who').innerHTML=S?'<span>'+T('வணக்கம்,','Hello,')+'</span> <b>'+esc(T(S.name,S.nameEn))+'</b>':'';if(S&&S.farm)$('brand').textContent=S.farm}
function tickClock(){var d=new Date(),t=mins(d),h=Math.floor(t/60);$('clk').textContent=((h%12)||12)+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+(t<720?' AM':' PM');

function rAtt(v){var h=recentH(v),F=curShift(),a=v.att[F];
 function box(G){var x=v.att[G],cls=x.t?'on':(x.off?'lv':''),big=x.t||(x.off?T('விடுப்பு','Leave'):'—');
  return'<div class="'+cls+'"><div class="t">'+shL(G)+'</div><b>'+esc(big)+'</b>'+(x.milk?'<i>🥛 '+T('பால் ','Milk ')+esc(x.milk)+'</i>':'')+'</div>'}
 h+='<div class="card"><div class="h"><div>'+T('வருகைப் பதிவேடு','Attendance register')+'</div></div><div class="shift">'+box('FN')+box('AN')+'</div>';

 if(a.t)btn='<button class="big done" id="bin" disabled>'+T('பதிவு செய்யப்பட்டது','Registered')+'</button>';
 else if(GPS)btn='<button class="big" id="bin" disabled>'+T('இருப்பிடம் சரிபார்க்கிறது…','Verifying GPS location…')+'</button>';
 else if(a.off)btn='<button class="big" id="bin" disabled>'+MS('leave_today',{'நேரம்':shL(F)})+'</button>';
 else btn='<button class="big" id="bin"'+(m<180||m>=1320?' disabled':'')+'>'+T('பதிவு செய்','Register')+'</button>';
 h+=btn+'</div>';
 var L=a.t?lateInfo(v,F):null;
 if(L){var al=L.allow?T(' (அனுமதி '+L.allow+' நிமி)',' (allowed '+L.allow+' min)'):'';
  h+='<div class="msg warn" style="display:block">'+MS(v.cfg.active?'late':'late_later',{'நேரம்':LANG==='en'?shL(F).toLowerCase():shL(F),'நிமிடம்':L.min,'அனுமதி':al,'தொகை':L.fine})+'</div>';
