<!doctype html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17485A">
<title>அமிர்தம் ஆவின்பால் — பணியாளர்</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Serif+Tamil:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16323B;--teal:#17485A;--teal2:#0F3644;--gold:#C9A227;--gold2:#F3D77A;--milk:#F7F3EA;--card:#fff;--line:#ECE6D8;--mute:#6B7A80;--ok:#2E7D32;--bad:#C62828;--brown:#6B3A1E;--amber:#B26A00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font-family:"Noto Sans Tamil",sans-serif;margin:0;background:var(--milk);color:var(--ink);padding-bottom:calc(86px + env(safe-area-inset-bottom))}
b,strong{font-weight:700}
.hero{background:radial-gradient(120% 140% at 0% 0%,#22607A 0%,var(--teal) 45%,var(--teal2) 100%);color:#fff;padding:22px 16px 52px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:76px;background:var(--milk);border-radius:50% 50% 0 0}
.hero .ring{position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;border:22px solid rgba(255,255,255,.05)}
.bt{font-family:"Noto Serif Tamil",serif;font-weight:800;font-size:24px;line-height:1.2;letter-spacing:.3px;position:relative;z-index:1;padding-right:96px}
.lt{position:absolute;right:12px;top:14px;z-index:3;display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:2px}
.lt span{padding:4px 11px;border-radius:12px;font-size:12.5px;color:#D7E7EC;cursor:pointer;font-family:Inter,"Noto Sans Tamil",sans-serif;font-weight:600}
.lt span.on{background:#fff;color:var(--teal)}
.today{position:relative;z-index:2;margin:-38px 14px 0;background:var(--card);border-radius:18px;box-shadow:0 8px 24px rgba(23,72,90,.13);padding:14px 16px;display:flex;align-items:center;gap:10px}
.today .dt{flex:1;min-width:0;font-size:min(17.5px,4.6vw);font-weight:700;color:var(--teal);line-height:1.35}
.today .ck{flex:none;font-family:Inter,sans-serif;font-weight:700;font-size:min(16px,4.2vw);color:var(--teal);background:#EEF5F7;border-radius:10px;padding:4px 10px;white-space:nowrap}
.who{margin:14px 18px 0}
.portal{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.6px;text-transform:uppercase}
.hi{font-size:15px;color:var(--mute);margin-top:6px}
.nm{font-size:21px;font-weight:700;color:var(--teal);line-height:1.3}
.net{margin:10px 14px 0;padding:8px 12px;border-radius:12px;font-size:13.5px;display:none;line-height:1.45}
.net.q{display:block;background:#FFF4CC;color:#7A5A00}.net.off{display:block;background:#EEF1F2;color:#455A64}.net.auth{display:block;background:#FDECEA;color:var(--bad);font-weight:700}
.card{background:var(--card);margin:12px 14px;border-radius:18px;padding:15px 16px;box-shadow:0 2px 10px rgba(23,72,90,.07)}
.h{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h small{font-size:13px;font-weight:600;color:var(--teal);border:1.5px solid var(--teal);border-radius:12px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.shift{display:flex;gap:10px;margin-bottom:4px}
.shift>div{flex:1;border-radius:14px;background:#F6F8F8;padding:10px 12px;min-width:0}
.shift .t{font-size:13px;color:var(--mute)}
.shift b{display:block;font-family:Inter,sans-serif;font-size:21px;margin-top:2px}
.shift i{font-style:normal;font-size:12.5px;color:var(--mute);display:block;margin-top:2px}
.shift>div.on{background:#E9F4EA}.shift>div.on b{color:var(--ok)}
.shift>div.lv{background:#EDF3FB}.shift>div.lv b{font-family:inherit;font-size:16px;color:#1F5C99}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;border:0;border-radius:18px;font-size:21px;font-weight:700;padding:15px 10px 13px;color:#fff;background:linear-gradient(180deg,#36934A,#2A7A3C);margin:12px 0 4px;font-family:inherit;box-shadow:0 5px 0 #1F5E2D;cursor:pointer;line-height:1.3;text-align:center}
.big.t{background:linear-gradient(180deg,#22607A,var(--teal));box-shadow:0 5px 0 #0E3341}
.big.y{background:linear-gradient(180deg,#D3AC33,#B8901B);box-shadow:0 5px 0 #8E6E10;font-size:18px}
.big.rd{background:linear-gradient(180deg,#D9534F,#B83A36);box-shadow:0 5px 0 #8A2724}
.big.w{background:#fff;color:var(--teal);border:2px solid var(--teal);box-shadow:0 4px 0 #CFDCE0}
.big:disabled{opacity:.45;box-shadow:none;transform:translateY(5px);cursor:default}
.big .s{font-size:12.5px;font-weight:600;opacity:.85;margin-top:2px}
.sm{font-size:13px;color:var(--mute);margin-top:8px;text-align:center}
.msg{margin:12px 14px 0;padding:13px 15px;border-radius:16px;font-size:15.5px;line-height:1.6;display:none;white-space:pre-line}
.ok{background:#E7F4E8;color:#1B5E20}.warn{background:#FFF3DC;color:#7A4C00}.err{background:#FDECEA;color:#B71C1C}.wait{background:#EAF2F5;color:var(--teal)}
input,select,textarea{font-size:17px;padding:12px;width:100%;margin:5px 0;border:1.5px solid #DCE3E5;border-radius:14px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal)}
.lbl{font-size:13px;color:var(--mute);margin-top:10px;font-weight:600}
.seg{display:flex;gap:8px;margin:5px 0 4px}.seg>span,.seg4>span{flex:1;text-align:center;padding:9px 2px 8px;border:1.5px solid #DCE3E5;border-radius:14px;font-size:15px;cursor:pointer;background:#fff;line-height:1.25}
.seg>span.on,.seg4>span.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.rule{font-size:13px;color:#4E5C61;background:#F6F4EE;border-radius:12px;padding:9px 11px;margin-top:12px;line-height:1.6}
.redbox{font-size:13.5px;color:#B71C1C;background:#FDECEA;border-radius:12px;padding:9px 11px;margin-top:8px;line-height:1.6;font-weight:600}
.rq{border-bottom:1px solid #F0ECE2;padding:11px 2px;font-size:15px}.rq:last-child{border-bottom:0}
.rq .t{display:flex;justify-content:space-between;gap:8px}.rq .t span:first-child{flex:1}
.pill{font-size:12.5px;font-weight:700;white-space:nowrap;border-radius:10px;padding:2px 9px;height:fit-content;display:inline-block}
.p{color:#8A6D00;background:#FFF4CC}.g{color:#1F6B2A;background:#E3F2E5}.r{color:#B71C1C;background:#FDE3E1}.gr{color:#777;background:#EEE}
.rep{font-size:14px;color:#334;margin-top:6px;background:#F6F8F8;border-radius:10px;padding:7px 10px}
.fl{font-size:12.5px;color:#B71C1C;margin-top:4px}
.mini{border:1.5px solid #DCE3E5;background:#fff;border-radius:12px;padding:6px 12px;font-size:13px;font-family:inherit;color:#555;margin-top:8px;cursor:pointer}
.a{font-size:15px;display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #F0ECE2}
.tot2{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:9px 2px 2px}
.cover{background:linear-gradient(160deg,#EAF4F7,#D5E9EF);border:2px solid var(--teal);border-radius:20px;padding:12px 10px 10px;margin:2px 0 12px}
.cover .ttl{text-align:center;font-size:14px;font-weight:700;color:var(--teal);letter-spacing:.4px;margin-bottom:9px}
.cv{display:flex;gap:8px}.cv div{flex:1;background:#fff;border-radius:15px;text-align:center;padding:9px 0 7px;box-shadow:0 2px 0 rgba(23,72,90,.12)}
.cv b{display:block;font-family:Inter,sans-serif;font-size:34px;line-height:1.1;color:var(--teal)}.cv span{font-size:13px;color:var(--mute)}
.cover .tot{text-align:center;font-size:15px;margin-top:9px;color:var(--teal)}
.veh{border-radius:16px;padding:12px;text-align:center;font-size:16.5px;font-weight:700;margin-bottom:12px;line-height:1.45}
.veh.y{background:#E7F4E8;color:#1B5E20;border:2px solid #2E7D32}.veh.n{background:#FDECEA;color:#B71C1C;border:2px solid #C62828}
.dl{font-size:15px;line-height:1.7;background:#FBF8F2;border-radius:12px;padding:9px 12px}
.hd{font-size:14px;color:var(--brown);font-weight:800;margin-top:10px;letter-spacing:.2px;border-bottom:1.5px solid #E8D6C4;padding-bottom:2px}
.hd:first-child{margin-top:0}
.ln{padding:2px 0}.ln.red{color:var(--bad);font-weight:700}.ln.dn{color:#1F5C99}.ln.up{color:var(--ok)}
.stale{background:#FDECEA;color:var(--bad);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.upd{font-size:12px;color:var(--mute);text-align:right;margin-top:6px}
/* டெலிவரி */
.prog{height:10px;background:#E4ECEE;border-radius:6px;overflow:hidden;margin:4px 0 2px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#36934A,#5DB56E)}
.progt{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.stop{border:2.5px solid var(--teal);border-radius:20px;padding:14px 14px 12px;background:linear-gradient(180deg,#FFFFFF,#F4FAFB)}
.stop .nx{font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.6px}
.stop .nmx{font-size:24px;font-weight:800;color:var(--teal);line-height:1.3;margin-top:2px}
.rtn{font-family:Inter,sans-serif;background:var(--teal);color:#fff;border-radius:10px;padding:0 8px;font-size:.85em;margin-right:2px}
.pkbig{font-size:30px;font-weight:800;font-family:Inter,"Noto Sans Tamil",sans-serif;color:var(--ink);margin:8px 0 2px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:10px;padding:3px 10px;margin:4px 4px 0 0}
.tag.dn{background:#E3EEF9;color:#1F5C99}.tag.up{background:#E3F2E5;color:var(--ok)}.tag.alt{background:#F3E8FF;color:#6A1B9A}.tag.sw{background:#FFF0D9;color:var(--amber)}
.onote{background:#FFF8E1;border-radius:10px;padding:7px 10px;font-size:14.5px;margin-top:8px;color:#5D4300}
.ph{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:10px;background:#EEE}
.two{display:flex;gap:10px}.two>button{flex:1;min-width:0;margin-top:10px;font-size:19px;padding-left:6px;padding-right:6px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lk{border:1.5px solid #CFDCE0;background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;font-family:inherit;color:var(--teal);font-weight:600;cursor:pointer}
.iss label{display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:16px;border-bottom:1px solid #F0ECE2}.iss input{width:22px;height:22px;margin:0}
.lst .row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #F0ECE2;font-size:15px;cursor:pointer}
.lst .row:last-child{border-bottom:0}
.lst .ic{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.ic.d{background:#E3F2E5;color:var(--ok)}.ic.i{background:#FFF0D9;color:var(--amber)}.ic.p{background:#EEF1F2;color:#90A4AE}.ic.c{background:var(--teal);color:#fff}
.lst .row .q{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap}
.lst .row.cur{background:#EEF6F8;border-radius:12px}
details{margin-top:10px}summary{font-size:14.5px;font-weight:700;color:var(--teal);cursor:pointer;padding:6px 0}
.bikew{background:#FDECEA;border:2.5px solid var(--bad);border-radius:18px;padding:14px;color:#8E1B1B;font-size:18.5px;font-weight:700;line-height:1.75}
.bikeq{font-size:19px;font-weight:800;color:var(--teal);text-align:center;margin:14px 0 2px}
.thanks{background:#E7F4E8;border-radius:18px;padding:16px;font-size:18px;font-weight:700;color:#1B5E20;line-height:1.7;text-align:center}
/* பதிவு */
.mon{display:flex;background:#EFEBE0;border-radius:12px;padding:3px;margin:12px 14px 0}.mon>span{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:14.5px;cursor:pointer}
.mon>span.on{background:#fff;font-weight:700;color:var(--teal);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:10px}.chips>div{flex:1;background:#F6F8F8;border-radius:14px;padding:10px;text-align:center}.chips b{display:block;font-family:Inter,sans-serif;font-size:26px;color:var(--teal)}.chips span{font-size:13px;color:var(--mute)}
.el{border-radius:14px;padding:11px 12px;margin-top:10px;font-size:14.5px;line-height:1.6}
.el.g{background:#E7F4E8;color:#1B5E20}.el.r{background:#FDECEA;color:#B71C1C}.el.n{background:#F6F4EE;color:#4E5C61}
.day{border-bottom:1px solid #F0ECE2;padding:11px 2px}.day:last-child{border-bottom:0}
.day .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:15.5px}
.day .sl{font-size:14px;line-height:1.6;margin-top:4px}.day .sl b{color:var(--teal)}
.day .lt2{color:var(--bad);font-size:13.5px}
.day .mm{font-size:13.5px;margin-top:5px;background:#FBF8F2;border-radius:10px;padding:6px 9px;line-height:1.55}
.slip .a b{font-family:Inter,sans-serif}.slip .a.n{color:var(--bad)}.slip .a.t{font-weight:700;border-top:1.5px solid #DDD}.slip .a.net{font-weight:800;font-size:17px;color:var(--ok);border-bottom:0}
/* விதிமுறை */
.rules h3{font-size:16px;color:var(--teal);margin:18px 0 6px;display:flex;align-items:center;gap:9px}.rules h3:first-child{margin-top:2px}
.rules h3 span{background:var(--teal);color:#fff;border-radius:50%;width:25px;height:25px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-family:Inter,sans-serif}
.rules ul{margin:0;padding-left:20px}.rules li{font-size:14.5px;line-height:1.65;margin:4px 0}.rules li.red{color:#B71C1C;font-weight:700}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;margin:10px 0 4px;color:#B71C1C;font-weight:700}.chk input{width:22px;height:22px;margin:0}
/* பக்கங்கள் */
.sec{display:none}.sec.on{display:block}
.sec.inR{animation:inR .25s ease}.sec.inL{animation:inL .25s ease}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid #E8E2D2;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9;box-shadow:0 -4px 18px rgba(23,72,90,.08)}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;border-radius:14px;color:#7D8A8F;position:relative;cursor:pointer}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav b{font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav a.on{color:var(--teal);background:#E6F0F3}.nav a.on b{font-weight:700}
.nav .n{position:absolute;top:1px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:9px;min-width:17px;height:17px;font-size:10.5px;font-family:Inter,sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.sheet{position:fixed;inset:0;background:rgba(10,30,38,.55);z-index:20;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h4{margin:0 0 6px;font-size:18px;color:var(--teal)}
.prev{width:100%;border-radius:14px;margin-top:8px;max-height:240px;object-fit:cover}
.gate{padding:40px 22px;text-align:center;font-size:18px;line-height:1.7;color:var(--teal)}
</style></head><body>
<div class="hero"><div class="ring"></div>
 <div class="lt" id="lt"><span data-v="ta">தமிழ்</span><span data-v="en">EN</span></div>
 <div class="bt" id="brand">அமிர்தம் ஆவின்பால்</div></div>
<div class="today"><div class="dt" id="dtxt"></div><div class="ck" id="clk"></div></div>
<div class="who"><div class="portal" id="portal"></div><div class="hi" id="hi"></div><div class="nm" id="nm"></div></div>
<div id="net" class="net"></div>
<div id="msg" class="msg"></div>

<div class="sec" id="s_att"><div id="att"></div></div>
<div class="sec" id="s_run"><div id="run"></div></div>
<div class="sec" id="s_rec"><div class="mon" id="recm"><span data-v="cur"></span><span data-v="prev"></span></div><div id="rec"></div></div>
<div class="sec" id="s_req">
 <div class="mon" id="reqm"><span data-v="lv"></span><span data-v="adv"></span></div>
 <div id="w_lv">
  <div class="card"><div class="h"><div id="t_newreq"></div></div>
   <div class="seg4" id="rtype"><span data-v="LV"></span><span data-v="EL"></span><span data-v="SK"></span><span data-v="LT"></span></div>
   <div class="lbl" id="l_date"></div><input type="date" id="rdate">
   <div id="w_part"><div class="lbl" id="l_shift"></div><div class="seg" id="rpart"><span data-v="FN"></span><span data-v="AN"></span><span data-v="FD"></span></div></div>
   <div id="w_full" class="lbl" style="display:none;font-size:15px;color:var(--teal)"></div>
   <div id="w_lt" style="display:none">
    <div class="lbl" id="l_howlate"></div><div class="seg" id="rmins"><span data-v="15"></span><span data-v="30"></span><span data-v="45"></span><span data-v="60"></span></div>
    <div class="sm" id="ltto" style="text-align:left;color:var(--teal);font-weight:600"></div>
    <div class="lbl" id="l_reason"></div><select id="rwhy"></select>
   </div>
   <div class="lbl" id="l_note"></div><input id="rnote" maxlength="200">
   <button class="big y" id="breq"></button>
   <div class="rule" id="rhint"></div>
   <div class="redbox" id="ltred" style="display:none"></div>
  </div>
  <div class="card"><div class="h"><div id="t_myreq"></div></div><div id="rlist"></div></div>
 </div>
 <div id="w_adv" style="display:none">
  <div class="card"><div class="h"><div id="t_advreq"></div></div>
   <input id="aamt" type="number" inputmode="numeric">
   <div class="lbl" id="l_need"></div><input type="date" id="adate">
   <label class="chk" id="w_emg" style="display:none"><input type="checkbox" id="aemg"><span id="l_emg"></span></label>
   <input id="awhy" maxlength="200">
   <button class="big y" id="badv"></button>
   <div class="rule" id="ahint"></div></div>
  <div class="card"><div class="h"><div id="t_areqs"></div></div><div id="alist"></div></div>
  <div class="card"><div class="h"><div id="t_gotm"></div></div><div id="glist"></div></div>
 </div>
</div>
<div class="sec" id="s_rule"><div class="card rules" id="rules"></div></div>

<div class="sheet" id="mk"><div class="in" id="mkin"></div></div>

<nav class="nav" id="nav">
 <a data-t="att"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/></svg><b></b></a>

function $(i){return document.getElementById(i)}
function T(ta,en){return LANG==='en'?en:ta}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x==null?null:JSON.parse(x)}localStorage.setItem(k,JSON.stringify(v));return v}catch(e){return null}}
function p2(n){return('0'+n).slice(-2)}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function mins(d){return d.getHours()*60+d.getMinutes()}
function hm(d){return p2(d.getHours())+':'+p2(d.getMinutes())}
function tmin(s,pm){var m=String(s||'').match(/(\d{1,2})\s*[:.]\s*(\d{1,2})/);if(!m)return null;var h=+m[1];if(pm&&h<12)h+=12;return h*60+(+m[2])}
function h12(t){t=((t%1440)+1440)%1440;var h=Math.floor(t/60);return((h%12)||12)+':'+p2(t%60)+(t<720?' AM':' PM')}
function hh(t){t=((t%1440)+1440)%1440;var h=Math.floor(t/60);return p2((h%12)||12)+':'+p2(t%60)}
function dur(m){if(m==null||m<0)return'';return m<60?m+T(' நி',' min'):Math.floor(m/60)+T(' ம ',' h ')+(m%60)+T(' நி',' min')}
function fmtN(x){return Math.round(Number(x)||0).toLocaleString('en-IN')}
function shL(F){return F==='FN'?T('காலை','Morning'):T('மாலை','Evening')}
function curShift(){return mins(new Date())<720?'FN':'AN'}
function dist(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.pow(Math.sin(x/2),2)+Math.cos(a*r)*Math.cos(c*r)*Math.pow(Math.sin(y/2),2);return Math.round(2*6371000*Math.asin(Math.sqrt(h)))}
function pkTxt(p){var t=[],u=T(' லி',' L');if(p[0])t.push('1'+u+(p[0]>1?' × '+p[0]:''));if(p[1])t.push('0.7'+u+(p[1]>1?' × '+p[1]:''));if(p[2])t.push('0.5'+u+(p[2]>1?' × '+p[2]:''));return t.join(' + ')}
function qL(q){return(Math.round(q*100)/100)+' '+T('லி','L')}
function rtn(s){return'<span class="rtn">'+esc(s.rt)+'</span> - '+esc(s.n)}
function whyL(w){var i=(S&&S.why||[]).indexOf(w);return LANG==='en'&&i>=0?WHY_EN[i]:w}
function issL(w){var i=(S&&S.issues||[]).indexOf(w);return LANG==='en'&&i>=0?ISS_EN[i]:w}
function M(c,t){var m=$('msg');if(!t){m.style.display='none';return}m.className='msg '+c;m.textContent=t;m.style.display='block';window.scrollTo(0,0)}

function enq(fn,p){var it={cid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),fn:fn,at:Date.now(),p:p,n:0};Q.push(it);ls('q',Q);renderAll();setTimeout(sync,200);return it}
function blankAtt(){return{t:'',milk:'',st:'',why:'',allow:0,off:false,b:'',e:'',bike:''}}
function view(){
 if(!S)return null;var v=JSON.parse(JSON.stringify(S)),now=new Date(),td=ymd(now);
 if(v.today!==td){v.att={FN:blankAtt(),AN:blankAtt()};v.dlog={FN:{},AN:{},mk:{}};v.oldDay=true;v.today=td;v.offNext={FN:false,AN:false}}
 Q.forEach(function(it){var d=new Date(it.at);if(ymd(d)!==td)return;var F=it.p.shift||(mins(d)<720?'FN':'AN'),a=v.att[F];
  if(it.fn==='in'){if(!a.t){a.t=hm(d);a.st='P'}}
  else if(it.fn==='why'){a.why=it.p.why}
  else if(it.fn==='dstart'){if(!a.b)a.b=hm(d)}
  else if(it.fn==='dend'){if(!a.e)a.e=hm(d)}
  else if(it.fn==='bike'){a.bike=it.p.ans}
  else if(it.fn==='stop'){if(it.p.a==='undo')delete v.dlog[F][it.p.id];else v.dlog[F][it.p.id]={a:it.p.a,why:it.p.why}}
  else if(it.fn==='mark'){v.dlog.mk[it.p.id]=1}});
 return v}
function post(fn,args){
 var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},40000);
 return fetch(API,{method:'POST',body:JSON.stringify({key:K,fn:fn,args:[args]}),signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.text()}).then(function(t){clearTimeout(tm);var j;try{j=JSON.parse(t)}catch(x){var e1=new Error('JSON? '+t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,160));e1.srv=1;throw e1}if(!j.ok){var e2=new Error(j.err||'?');e2.srv=1;throw e2}return j.r},function(e){clearTimeout(tm);throw e})}
function sync(){
 if(!K)return;if(SYNC){AGAIN=true;return}SYNC=true;
 var items=Q.slice(0,40),fn=items.length?'sync':'state';
 var args=items.length?{items:items.map(function(x){return{cid:x.cid,fn:x.fn,at:x.at,p:x.p}}),now:Date.now(),lang:LANG}:{lang:LANG};
 post(fn,args).then(function(r){
  var st=items.length?r.state:r,bad=[];
  if(items.length){r.res.forEach(function(x){var i=-1;Q.forEach(function(q,k){if(q.cid===x.cid)i=k});if(i<0)return;
   if(x.ok||!x.retry){Q.splice(i,1);if(!x.ok&&x.msg)bad.push(x.msg)}else{Q[i].n=(Q[i].n||0)+1;if(Q[i].n>=6){bad.push(x.msg||'?');Q.splice(i,1)}}});ls('q',Q)}
  S=st;ls('st',S);NET='ok';renderAll();if(bad.length)M('err',bad.join('\n\n'));
 }).catch(function(e){var m=String(e&&e.message||e);NET=/AUTH/.test(m)?'auth':(e&&e.srv)?'err':'off';ERRM=m;renderNet()}).then(function(){SYNC=false;if(AGAIN){AGAIN=false;setTimeout(sync,400)}})}
function act(a,p,after){
 if(BUSY)return;BUSY=true;M('wait',T('அனுப்புகிறது…','Sending…'));p=p||{};
 post('act',{a:a,p:p,lang:LANG}).then(function(r){BUSY=false;if(r.state){S=r.state;ls('st',S)}renderAll();M(r.ok?(r.warn?'warn':'ok'):'err',r.msg);if(after)after(r)})
  .catch(function(e){BUSY=false;NET=/AUTH/.test(String(e&&e.message))?'auth':'off';renderNet();M('err',T('இணையம் இல்லை — signal வந்ததும் மீண்டும் அனுப்பவும்.','No internet — please send again when you have signal.'))})}

 if(q){n.className='net q';n.textContent=T('⏳ '+q+' பதிவு phone-ல் உள்ளது — signal வந்ததும் தானாக அனுப்பப்படும்.','⏳ '+q+' entries saved on phone — sent automatically when signal returns.')+(NET==='off'?' 📵':'');return}
 if(NET==='err'){n.className='net auth';n.textContent=T('⚠ Sheet பிழை — உரிமையாளரிடம் இந்தச் செய்தியைக் காட்டுங்கள்: ','⚠ Sheet error — show this to the owner: ')+ERRM;return}
 if(NET==='off'){n.className='net off';n.textContent=T('📵 இணையம் இல்லை — பதிவுகள் phone-ல் சேமிக்கப்படும்.','📵 No internet — entries are saved on the phone.');return}
 n.className='net';n.textContent=''}

function lateInfo(v,F){var a=v.att[F],c=v.cfg,t=tmin(a.t,F==='AN');if(t==null)return null;var st=F==='FN'?c.fnStart:c.anStart,late=t-st;
 if(late<=c.grace+(a.allow||0))return null;return{min:late,allow:a.allow||0,fine:Math.max(0,late-(a.allow||0)-c.grace)*c.lateRate}}
function rAtt(v){var h='',F=curShift(),a=v.att[F];
 function box(G){var x=v.att[G],cls=x.t?'on':(x.off?'lv':''),big=x.t||(x.off?T('விடுப்பு','Leave'):'—');
  return'<div class="'+cls+'"><div class="t">'+shL(G)+'</div><b>'+esc(big)+'</b>'+(x.milk?'<i>🥛 '+T('பால் ','Milk ')+esc(x.milk)+'</i>':'')+'</div>'}
 h+='<div class="card"><div class="h"><div>'+T('இன்றைய வருகை','Today')+'</div></div><div class="shift">'+box('FN')+box('AN')+'</div>';
 var m=mins(new Date()),dis=!!a.t||a.off||m<180||m>=1320,lab;
 if(a.t)lab=T('✓ '+shL(F)+' வருகை · ','✓ Arrived · ')+a.t;else if(a.off)lab=T('இன்று '+shL(F)+' உங்களுக்கு விடுப்பு','You are on leave this '+shL(F).toLowerCase());else lab=T('✓ வந்துவிட்டேன்','✓ I have arrived');
 h+='<button class="big" id="bin" '+(dis?'disabled':'')+'>'+lab+'</button>';
 h+='<div class="sm">'+T('இம்மாதம் வந்தது: காலை '+v.nFN+' · மாலை '+v.nAN,'This month: Morning '+v.nFN+' · Evening '+v.nAN)+'</div></div>';
 var L=a.t?lateInfo(v,F):null;
 if(L){var t;
  if(LANG==='en'){t='You came <b>'+L.min+' minutes</b> late this '+shL(F).toLowerCase()+(L.allow?' (allowed '+L.allow+' min)':'')+'. ';if(L.fine>0)t+=v.cfg.active?'<b>₹'+L.fine+'</b> will be cut from your salary. ':'<b>₹'+L.fine+'</b> will be cut from '+esc(v.cfg.penEn)+'. ';t+='Please come on time to avoid fines.'}
  else{t='இன்று '+shL(F)+' <b>'+L.min+' நிமிடம்</b> தாமதமாக வந்துள்ளீர்கள்'+(L.allow?' (அனுமதி '+L.allow+' நிமி)':'')+'. ';if(L.fine>0)t+=v.cfg.active?'தாமதத்துக்கு <b>₹'+L.fine+'</b> உங்கள் சம்பளத்தில் பிடிக்கப்படும். ':'தாமதத்துக்கு <b>₹'+L.fine+'</b> — '+esc(v.cfg.pen)+' முதல் பிடிக்கப்படும். ';t+='அபராதங்களைத் தவிர்க்க தயவுசெய்து சரியான நேரத்துக்கு வருகை தாருங்கள்.'}
  h+='<div class="msg warn" style="display:block">⏰ '+t+'</div>';
  h+='<div class="card"><div class="h"><div>'+T('தாமதக் காரணம்','Reason for late')+'</div></div>';
  if(a.why)h+='<span class="pill g">✓ '+T('பதிவானது','Saved')+' — '+esc(whyL(a.why))+'</span></div>';
  else{h+='<div class="sm" style="text-align:left;margin:0 0 6px">'+T('காரணம் அனுப்பிய பிறகே இன்றைய கவர் கணக்கு தெரியும்.','The cover count shows after you send the reason.')+'</div><select id="lwhy"><option value="">'+T('காரணம் தேர்வு செய்யவும்','Choose reason')+'</option>';
   (v.why||[]).forEach(function(w,i){h+='<option value="'+esc(w)+'">'+esc(LANG==='en'?WHY_EN[i]:w)+'</option>'});
   h+='</select><input id="lexp" maxlength="200" placeholder="'+T('விளக்கம் (மற்றவை என்றால் கட்டாயம்)','Details (must for Other)')+'"><button class="big y" id="bwhy">'+T('காரணம் அனுப்பு','Send reason')+'</button></div>'}}
 if(a.t&&(!L||a.why))h+=delivCard(v,F,true);
 else if(!a.t&&!a.off)h+='<div class="sm" style="margin:6px 18px">'+T('"வந்துவிட்டேன்" அழுத்திய பிறகு இன்றைய கவர் கணக்கு தெரியும்.','After "I have arrived", today\'s cover count shows here.')+'</div>';
 $('att').innerHTML=h;
 if($('bin'))$('bin').onclick=arrive;if($('bwhy'))$('bwhy').onclick=function(){sendWhy(F)};bindRef()}
function bindRef(){[].forEach.call(document.querySelectorAll('[data-ref]'),function(e){e.onclick=function(){M('wait',T('புதுப்பிக்கிறது…','Refreshing…'));sync();setTimeout(function(){if($('msg').className.indexOf('wait')>=0)M()},2500)}});

function staleBox(v){var d=v.deliv;

 if(!d){return h+'<div class="sm" style="text-align:left">'+T('இன்றைய விநியோக விவரம் இன்னும் தயாராகவில்லை.','Today\'s delivery details are not ready yet.')+'</div></div>'}

 if(F==='FN'){var vy=v.deliv.veh!==false;h+='<div class="veh '+(vy?'y':'n')+'">'+(vy?T('🛵 இன்று காலை டெலிவரிக்குப் பின் வண்டி கொண்டு போகலாம்','🛵 You may take the bike after the morning delivery'):T('🚫 இன்று காலை வண்டி கொண்டு போகக்கூடாது','🚫 Do not take the bike this morning'))+'</div>'}
 h+=sections(d);
 if(withBtn)h+='<button class="big t" data-go="run">▶ '+T('டெலிவரி பக்கம்','Go to delivery')+'</button>';
 if(v.deliv.at)h+='<div class="upd">'+T('பட்டியல் நேரம் ','List time ')+hm(new Date(v.deliv.at))+'</div>';

function sections(d){var chg=[],alt=[],swp=[],wo=[];
